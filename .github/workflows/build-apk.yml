name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 21 (Required for Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure gradlew is executable
        working-directory: ./android
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Stage Named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/TicTacToe-Arena-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Arena-debug-apk
          path: android/app/build/outputs/apk/debug/TicTacToe-Arena-debug.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tic Tac Toe Arena — Android APK (Latest)
          make_latest: true
          files: android/app/build/outputs/apk/debug/TicTacToe-Arena-debug.apk
          body: |
            ## Tic Tac Toe Arena (Web + Android Cross-Play)

            - **Download Android APK:** Attach `TicTacToe-Arena-debug.apk` below.
            - **Live Web App:** https://ttt-arena-quantum.web.app
            - **Features:** Endless League + On-Demand Finals (Top 2 / Top 4), Normal 3x3 & Expert Free-Choice Nested 3x3 (with Auto-Reset Draws), Online Firebase Multiplayer, AI Bots, and Local Pass-and-Play.
